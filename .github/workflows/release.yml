name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Create GitHub Release ──────────────────────────────────────────────────

  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_url: ${{ steps.create_release.outputs.html_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          echo "## Release v${{ steps.version.outputs.VERSION }}" > CHANGELOG_ENTRY.md
          echo "" >> CHANGELOG_ENTRY.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$(git describe --tags --abbrev=0 2>/dev/null || echo "")...v${{ steps.version.outputs.VERSION }}" >> CHANGELOG_ENTRY.md
          echo "" >> CHANGELOG_ENTRY.md
          echo "### Changes" >> CHANGELOG_ENTRY.md
          git log $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD --pretty=format:"* %s" >> CHANGELOG_ENTRY.md 2>/dev/null || true

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Vulturius v${{ steps.version.outputs.VERSION }}"
          body_path: CHANGELOG_ENTRY.md
          draft: false
          prerelease: false

  # ─── Build & Upload Artifacts ───────────────────────────────────────────────

  build-release:
    name: Build & Upload (${{ matrix.build-type }})
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build-type: linux-x86_64
            binary-ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build-type: windows-x86_64
            binary-ext: ".exe"
          - os: macos-latest
            target: x86_64-apple-darwin
            build-type: macos-x86_64
            binary-ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            build-type: macos-aarch64
            binary-ext: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: matrix.build-type == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p vulturius-core -p vulturius-cli

      - name: Create tarball
        shell: bash
        run: |
          mkdir -p dist/vulturius-${{ matrix.build-type }}
          cp "target/${{ matrix.target }}/release/vulturius-cli${{ matrix.binary-ext }}" dist/vulturius-${{ matrix.build-type }}/
          cp LICENSE dist/vulturius-${{ matrix.build-type }}/ 2>/dev/null || true
          cp README.md dist/vulturius-${{ matrix.build-type }}/ 2>/dev/null || true

          if [ "${{ matrix.build-type }}" = "windows-x86_64" ]; then
            cd dist
            powershell -Command "Compress-Archive -Path vulturius-${{ matrix.build-type }} -Destination vulturius-${{ matrix.build-type }}.zip"
          else
            tar czf "vulturius-${{ matrix.build-type }}.tar.gz" -C dist vulturius-${{ matrix.build-type }}
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            vulturius-${{ matrix.build-type }}.zip
            vulturius-${{ matrix.build-type }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Publish to crates.io ───────────────────────────────────────────────────

  publish-crate:
    name: Publish to crates.io
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Publish vulturius-core
        run: cargo publish -p vulturius-core --token ${{ secrets.CARGO_TOKEN }}
        continue-on-error: true

      - name: Publish vulturius-cli
        run: cargo publish -p vulturius-cli --token ${{ secrets.CARGO_TOKEN }}
        continue-on-error: true
