[workspace]
members = [
    "crates/vulturius-core",
    "crates/vulturius-cli",
    "crates/vulturius-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Vulturius Team"]
license = "MIT"
repository = "https://github.com/vulturius/vulturius"
rust-version = "1.85"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Filesystem
walkdir = "2"
ignore = "0.4"
sysinfo = "0.33"
filetime = "0.2"
sha2 = "0.10"

# Config
config = { version = "0.14", features = ["toml"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
indicatif = "0.17"

# LLM
reqwest = { version = "0.12", features = ["json", "stream"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Misc
chrono = { version = "0.4", features = ["serde"] }
humansize = "2"
pathdiff = "0.2"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }

# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"

# Workspace-local
vulturius-core = { path = "crates/vulturius-core" }
